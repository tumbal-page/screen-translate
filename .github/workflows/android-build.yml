name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up compatible Gradle version
        # Gradle provided by the runner (9.x) is not compatible with Android Gradle Plugin 8.0.2
        # Use gradle-build-action to provide Gradle 8.0.x
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.0'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Build Debug APK
        run: |
          # Use gradlew if available, otherwise fallback to system gradle
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
        working-directory: .
      - name: Upload APK artifact
        # actions/upload-artifact v3 is deprecated; use v4
        uses: actions/upload-artifact@v4
        with:
          name: manga-screen-translator-apk
          path: app/build/outputs/apk/debug/app-debug.apk