## Configurations for Android build
## Use AndroidX libraries instead of old support libraries
android.useAndroidX=true

## Enable Jetifier to automatically migrate support libraries to AndroidX at build time
android.enableJetifier=true

## Suppress compileSdk warning for versions not explicitly supported by the current Android Gradle Plugin
## The project uses compileSdk=34 and AGP 8.0.2 (tested up to compileSdk=33). This property suppresses the warning.
android.suppressUnsupportedCompileSdk=34